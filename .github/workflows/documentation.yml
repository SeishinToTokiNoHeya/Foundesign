name: Documentation

on:
  push:
    branches: [develop]
    paths: &documentation-paths
      - 'Sources/**'
      - 'Example/**'
      - 'Package.swift'
      - 'README.md'
      - 'docs/**'
      - 'skills/**'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths: *documentation-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}

jobs:
  build:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: DocC 빌드
        run: |
          xcodebuild docbuild -project Example/Example.xcodeproj -scheme Foundesign \
            -destination 'generic/platform=macOS' -derivedDataPath .build/documentation \
            CODE_SIGNING_ALLOWED=NO OTHER_DOCC_FLAGS='--warnings-as-errors'
      - name: 정적 웹 문서 준비
        run: |
          mkdir -p .build/site
          for module in Foundesign FoundesignFoundation FoundesignComponent; do
            xcrun docc process-archive transform-for-static-hosting \
              ".build/documentation/Build/Products/Debug/$module.doccarchive" \
              --output-path ".build/site/$module" \
              --hosting-base-path "/Foundesign/$module"
          done
      - name: Pages 산출물 저장
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build/site

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
